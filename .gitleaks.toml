# gitleaks 설정 — 기본 규칙을 그대로 쓰고, 좁은 허용 하나만 더한다.
#
# 허용은 **두 조건을 모두** 만족할 때만이다(condition = "AND"):
#   1. 파일이 Rust 명령 판정의 정답 파일 둘 중 하나다
#      (`crates/harkroom-operator/golden/gen_tool_rules.mts`·`tool_rules.json`).
#      이 둘은 TS `looksSecret` 의 AWS 키 판정을 Rust 와 대조하려고 **가짜** 키를 입력으로 담는다.
#   2. 잡힌 값이 그 가짜 키 하나다(AWS 문서의 예시 꼴, 실제 계정과 무관).
# 그 밖의 파일·값은 지금처럼 막는다. 이 파일에 규칙을 넓히지 마라 — 새 시험 값은 처음부터
# `'AK' + 'IA…'` 처럼 쪼개 써서 검사에 걸리지 않게 한다.
#
# 아래 정규식은 `[A]` 로 한 글자를 묶어, 이 설정 파일 자체가 AWS 키 꼴로 잡히지 않게 썼다.

[extend]
useDefault = true

[[allowlists]]
description = "Rust 명령 판정 정답 파일의 가짜 AWS 키 하나"
condition = "AND"
paths = ['''^crates/harkroom-operator/golden/(gen_tool_rules\.mts|tool_rules\.json)$''']
regexTarget = "secret"
regexes = ['''^AKIA[A]BCDEFGHIJKLMNOP$''']
