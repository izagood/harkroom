[package]
name = "harkroom-roots"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Per-community operator root rule and operators.json index (P5) — Rust port of packages/shared/src/operatorRoots.ts. Not wired in yet."

# 버전은 `=` 로 고정한다(Rust 전환 계획의 약속). 올리는 것은 따로 PR 로.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.154"
