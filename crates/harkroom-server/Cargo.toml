[package]
name = "harkroom-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Rust front for the harkroom server (S5.1a): proxies every HTTP request to the TS server and checks the schema version. Not deployed yet."

[[bin]]
name = "harkroom-server-rs"
path = "src/main.rs"

# 버전은 `=` 로 고정한다. lock 의 모든 판은 공개 14일이 지난 것만 쓴다.
[dependencies]
# 이벤트 버스 쓰는 쪽(S5.0) — outbox 계약을 한 곳에 둔다(P3 쓰기 바탕).
harkroom-bus = { path = "../harkroom-bus" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "multipart"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
# 오퍼레이터 이름 정리(C2a) — shared `normalizeOperatorLabel` 의 유니코드 속성(\p{Extended_Pictographic} 등).
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode-bool", "unicode-gencat", "unicode-perl"] }
# MCP `grant.list`(S5.3 C4b)의 명령 허용 규칙 판정 — 서버·hook·오퍼레이터가 같은 판정(TS 골든 고정)을 쓴다. 사본을 두지 않는다.
harkroom-proto = { path = "../harkroom-proto" }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
# APNs 전송(C5e-1) — HTTP/2 over TLS + ES256 JWT. rustls·ring·webpki-roots 는 오퍼레이터와 같은 판이다(이미 쓰는 판).
# ring 은 P-256 고정 길이 서명(P1363)을 바로 낸다 — APNs 는 DER 서명을 거절한다.
bytes = "=1.12.1"
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# 초대 메일 SMTP(S5.4) — rustls(ring) 만, native-tls·pool·hostname 없음.
lettre = { version = "=0.11.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
webpki-roots = "=1.0.11"
# avcs 클라이언트(`avcs_http`)의 scheme 별 커넥터 — hyper-util legacy Client 가 받는 Service 트레이트. 이미 잠금 파일에 있던 판.
tower-service = "=0.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
# 서버 ↔ UI 타입(P6)의 TS 생성. 생성 import 의 `.js` 는 아래 `TS_RS_IMPORT_EXTENSION` 참고.
ts-rs = "=12.0.1"
# 링크 판정(C3a-3a) — shared `isDrawnLink` 의 `new URL()` 과 같은 WHATWG 파서. 이미 잠금 파일에 있던 판.
url = "=2.5.8"
# 비밀 값 열기(S5.3 keyring) — TS `secretKeyring.ts` 의 v2 봉투를 연다. 열기만 하므로 난수(getrandom) 기능은 끄고,
# 키 스케줄·GHASH 상태를 지우는 `zeroize` 기능을 켠다.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "=0.22.1"
# 키 확인값 비교(시간 차 없는 비교). ring 의 `constant_time` 은 0.17.14 에서 "부채널 약속 없음"으로 폐기 예고됐다. 이미 잠금 파일에 있던 판.
subtle = { version = "=2.6.1", default-features = false }
# 「내 작업」 보드 응답 압축(S5.4 MS2c-2) — TS `compressBody.ts`(node zlib) 와 같은 br 품질 4·gzip 6. flate2 는 순수 Rust
# 백엔드(miniz_oxide)만 켠다(C 라이브러리 없음).
brotli = "=9.1.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
# HKDF·HMAC 0.13 은 digest 0.11 을 쓴다 — 위의 sha2 0.10(digest 0.10)과 따로 둔다. 이미 잠금 파일에 있던 판.
sha2_011 = { package = "sha2", version = "=0.11.0", features = ["zeroize"] }
zeroize = "=1.9.1"
# 비밀번호 해시(S5.4 decision 1) — TS `argon2`(node-argon2 0.41) 와 같은 PHC 문자열 `$argon2id$v=19$m=65536,t=3,p=4$…`.
# 난수(getrandom) 기능은 끄고 위 getrandom 으로 소금을 만든다.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# 자동화 일정 트리거의 tz 벽시계(S5.4 결정 2) — TS `Intl.DateTimeFormat` 대신 IANA 표. 기본 기능(clock·serde 등)은 끈다.
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false }
# 아바타 래스터(S5.4) — PNG·JPEG 헤더/장 수 판정과 SVG → PNG 굳히기(TS sharp 대신). 글꼴·내장 래스터 기능은 끈다.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "=0.49.0", default-features = false }

# 망가뜨리기 시험 전용 판정 스위치(C3b-3a `core::decide_core::Checks`). **기본 꺼짐** — release 빌드에 들어가지 않는다.
# 시험 빌드에서만 아래 dev-dependency(자기 자신)가 켠다. `tests/decide_core.rs` 가 `default` 에 없는지 확인한다.
[features]
breakage-tests = []
# 가짜 APNs origin 으로 여는 시험용 생성자(`ApnsTransport::with_origins`). **기본 꺼짐** — 시험 빌드만 켠다.
test-origins = []

[dev-dependencies]
harkroom-server = { path = ".", features = ["breakage-tests", "test-origins"] }
# 가짜 APNs(h2c) 서버(C5e-1 시험).
hyper = { version = "=1.12.0", features = ["server", "http2"] }
# /ws 시험 클라이언트(앞단 의존 axum ws 가 이미 쓰는 판).
tokio-tungstenite = "=0.29.0"
# avcs https 시험(`avcs_http`)의 CA·서버 인증서를 실행 때 만든다 — 저장소에 키를 두지 않는다. ring 만.
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
