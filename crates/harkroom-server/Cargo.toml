[package]
name = "harkroom-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Rust front for the harkroom server (S5.1a): proxies every HTTP request to the TS server and checks the schema version. Not deployed yet."

[[bin]]
name = "harkroom-server-rs"
path = "src/main.rs"

# 버전은 `=` 로 고정한다. lock 의 모든 판은 공개 14일이 지난 것만 쓴다.
[dependencies]
# 이벤트 버스 쓰는 쪽(S5.0) — outbox 계약을 한 곳에 둔다(P3 쓰기 바탕).
harkroom-bus = { path = "../harkroom-bus" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
# 오퍼레이터 이름 정리(C2a) — shared `normalizeOperatorLabel` 의 유니코드 속성(\p{Extended_Pictographic} 등).
regex = { version = "=1.12.3", default-features = false, features = ["std", "unicode-bool", "unicode-gencat", "unicode-perl"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
# APNs 전송(C5e-1) — HTTP/2 over TLS + ES256 JWT. rustls·ring·webpki-roots 는 오퍼레이터와 같은 판이다(이미 쓰는 판).
# ring 은 P-256 고정 길이 서명(P1363)을 바로 낸다 — APNs 는 DER 서명을 거절한다.
bytes = "=1.12.1"
base64 = "=0.22.1"
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=1.0.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
# 서버 ↔ UI 타입(P6)의 TS 생성. 생성 import 의 `.js` 는 아래 `TS_RS_IMPORT_EXTENSION` 참고.
ts-rs = "=12.0.1"
# 링크 판정(C3a-3a) — shared `isDrawnLink` 의 `new URL()` 과 같은 WHATWG 파서. 이미 잠금 파일에 있던 판.
url = "=2.5.8"

[dev-dependencies]
# 가짜 APNs(h2c) 서버(C5e-1 시험).
hyper = { version = "=1.12.0", features = ["server", "http2"] }
# /ws 시험 클라이언트(앞단 의존 axum ws 가 이미 쓰는 판).
tokio-tungstenite = "=0.29.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "time"] }
