[package]
name = "harkroom-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Process-boundary shapes shared by TS and Rust (runner link, operator WS, app socket, merge CLI output). Not wired in yet."

# 버전은 `=` 로 고정한다(Rust 전환 계획의 약속). 올리는 것은 따로 PR 로.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
# 승인 규칙 판정(tool_rules.rs, 오퍼레이터에서 옮김). 오퍼레이터 lock 에 이미 있는 판·기능 그대로다.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
