[package]
name = "harkroom-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Rust port of the harkroom runner (S3 B3). B3a: config (env), runner link client (operator unix socket: hello, request/response, reconnect/backoff, rejection give-up, sticky pollStopped, notices), startup. Not wired in yet — the operator still spawns the node runner."

[[bin]]
name = "harkroom-runner-rs"
path = "src/main.rs"

# 버전은 `=` 로 고정한다(Rust 전환 계획의 약속). lock 의 모든 판은 공개 14일이 지난 것만 쓴다 —
# 여기 판은 전부 harkroom-operator 의 lock 에 이미 있던 판이다.
# 오퍼레이터와 같이 std::thread 구조다(tokio 없음).
[dependencies]
harkroom-proto = { path = "../harkroom-proto" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
