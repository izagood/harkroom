[package]
name = "harkroom-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Rust port of the harkroom runner (S3 B3). B3a: config (env), runner link client (operator unix socket: hello, request/response, reconnect/backoff, rejection give-up, sticky pollStopped, notices), startup. B3b-1: PTY pure half (spawn compose, paste sanitize, ready/gate screens, ring buffer, output coalescer). B3b-2a: PTY process half (openpty spawn, write/resize, SIGTERM→SIGKILL grace, reader) and recorder. B3b-2b: prompt injection state machine (ready/quiet, waitFor, gate deferral, bracketed paste + settled Enter, unsent nudge, in-turn gate, delivery confirm) and the PTY turn loop (run_pty_turn: reader/waiter threads, coalesced output, timeout, recorder). Not wired in yet — the operator still spawns the node runner."

[[bin]]
name = "harkroom-runner-rs"
path = "src/main.rs"

# 버전은 `=` 로 고정한다(Rust 전환 계획의 약속). lock 의 모든 판은 공개 14일이 지난 것만 쓴다 —
# 여기 판은 전부 harkroom-operator 의 lock 에 이미 있던 판이다.
# 오퍼레이터와 같이 std::thread 구조다(tokio 없음).
[dependencies]
harkroom-proto = { path = "../harkroom-proto" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# 준비·관문 판정(pty.rs). 오퍼레이터·harkroom-screen lock 에 이미 있는 판이다(regex-automata 0.4.18·regex-syntax 0.8.11).
# PTY 실행(pty_proc.rs: openpty·setsid·TIOCSCTTY·kill·waitid). 오퍼레이터 lock 에 이미 있는 판 — 새 PTY crate 를 들이지 않는다.
libc = "=0.2.191"
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }
