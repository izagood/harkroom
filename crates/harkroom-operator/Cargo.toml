[package]
name = "harkroom-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Rust port of the harkroom operator (S2). A1: `merge` wrapper client. A2: app socket server (hello/ping/listRunners). A3b: runner table (spawn/kill, runnerExit event), operators.json index read. A5a: local agent config (operatorAgent* 4)."

[[bin]]
name = "harkroom-operator-rs"
path = "src/main.rs"

# 버전은 `=` 로 고정한다(Rust 전환 계획의 약속). lock 의 모든 판은 공개 14일이 지난 것만 쓴다.
[dependencies]
harkroom-proto = { path = "../harkroom-proto" }
harkroom-roots = { path = "../harkroom-roots" }
serde = { version = "=1.0.228", features = ["derive"] }
# 출력 JSON 의 키 순서를 TS(`{...out, merged, exit}`)와 똑같이 지키려고 preserve_order 를 켠다.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
indexmap = "=2.14.2"
# kill(pid, 0) — TS isProcessAlive 와 같은 잔해 판정(security C2). lock 에 이미 있는 판이다.
libc = "=0.2.191"
