[package]
name = "harkroom-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Rust port of the harkroom operator (S2). A1: the `merge` wrapper client only. Not bundled yet."

[[bin]]
name = "harkroom-operator-rs"
path = "src/main.rs"

# 버전은 `=` 로 고정한다(Rust 전환 계획의 약속). lock 의 모든 판은 공개 14일이 지난 것만 쓴다.
[dependencies]
harkroom-proto = { path = "../harkroom-proto" }
serde = { version = "=1.0.228", features = ["derive"] }
# 출력 JSON 의 키 순서를 TS(`{...out, merged, exit}`)와 똑같이 지키려고 preserve_order 를 켠다.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
indexmap = "=2.14.2"
