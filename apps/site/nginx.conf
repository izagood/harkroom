# harkroom.com 소개 페이지. nginx-unprivileged 이미지의 기본 server 를 이것으로 바꾼다(8080, 비루트).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # TLS 는 앞단(Cloudflare·ingress)이 끝낸다. 여기서 절대 주소로 되돌리지 않게 한다.
    absolute_redirect off;
    server_tokens off;

    # 외부 요청이 하나도 없는 페이지다 — CSP 가 그것을 지킨다(글꼴·추적 스크립트가 끼어들면 막힌다).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # css·js 는 이름이 고정이라 오래 캐시하지 않는다(배포하면 한 시간 안에 바뀐다).
    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
