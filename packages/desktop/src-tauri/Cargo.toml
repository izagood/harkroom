[package]
name = "murmur-desktop"
version = "0.1.63"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.4.0"
# 본문의 링크를 OS 기본 브라우저로 넘기는 표면(#214). 여는 대상은 앱 쪽
# 허용 목록(src/lib/link.ts)이 http/https 로만 좁힌 뒤에 온다.
tauri-plugin-shell = "2"
# 앱 스스로 새 버전을 받아 설치하는 표면. `tauri.conf.json` 의 `plugins.updater` 가
# 공개키와 endpoints 를 정하고, 이 크레이트가 서명을 검증한 뒤에만 설치한다 —
# 공개키가 빠지면 플러그인이 초기화 단계에서 거절하므로 "검증 없이 설치"가 될 수 없다.
tauri-plugin-updater = "2"
# 설치 직후 새 버전으로 다시 뜨는 표면. updater 와 한 벌이다 — 설치만 하고 재시작이
# 없으면 디스크의 앱과 돌고 있는 앱이 갈린 채로 남는다.
tauri-plugin-process = "2"
# OS 키체인. Tauri 에 공식 플러그인이 없어 이 크레이트를 명령으로 노출한다(src/main.rs).
# apple-native / windows-native / linux-native-sync-persistent 로 각 OS 의 기본 저장소를 쓴다.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# daemon 과 주고받는 NDJSON 을 만들고 판다(#431 2단계-b 3/3). 프로토콜 정의 자체는
# `@murmur/shared/daemonProtocol` 에 있고, 여기는 그 절반(클라이언트)을 Rust 로 구현한다 —
# 웹뷰는 unix 소켓을 열 수 없어서 소켓을 쥐는 쪽이 Rust 일 수밖에 없다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# `NSUserNotificationCenter` 의 델리게이트를 직접 잡는다(`src/notification.rs` 머리 주석).
# 새로 들인 것이 아니다 — Tauri 가 이미 같은 버전을 끌고 있어 직접 의존으로 적어도
# 그래프가 늘지 않는다.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSDictionary",
  "NSObject",
  "NSUserNotification",
] }
# **알림 발신에 쓰지 않는다.** `set_application` 하나만 쓴다 — 그것이 하는 일은
# `NSBundle` 후킹이고, 번들 밖에서 뜬 개발 빌드가 알림을 띄울 수 있게 하는 유일한
# 조건이다(같은 주석의 "남겨 둔 한 가지 이유").
mac-notification-sys = "0.6.15"

[target.'cfg(unix)'.dependencies]
# 러너 자식을 자기 프로세스 그룹으로 분리하는 `setsid` 호출에만 쓴다(#431 1단계 A).
# `pre_exec` 안에서 부른다 — `tauri-plugin-shell` 은 이 제어를 노출하지 않는다.
libc = "0.2"

[[bin]]
name = "murmur-desktop"
path = "src/main.rs"
