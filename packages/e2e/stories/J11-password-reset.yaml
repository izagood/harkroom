id: J11
title: "관리자가 비밀번호 재설정 코드를 준다"
personas: [P1, P2, P4]
steps:
  - as: P2
    act: password.resetIssue
    on: desktop
    target: "P4"
    expect: "코드가 나오고 P4 에게 알림이 간다"
  - as: P4
    act: password.resetUse
    on: desktop
    expect: "로그인 화면에서 코드로 새 비밀번호를 정하고 들어간다"
  - as: P2
    act: api.denied
    on: api
    target: "P1"
    expect: "owner 는 대상이 될 수 없다"
expect: "멤버는 관리자 도움으로 다시 들어오고, owner 계정은 넘볼 수 없다"
failSigns:
  - "코드가 안 먹음"
  - "owner 비밀번호가 바뀜"
existing:
  - kind: server-vitest
    file: "packages/server/test/passwordReset.test.ts"
    note: "발급·사용·owner 제외"
runners: [api, browser]
