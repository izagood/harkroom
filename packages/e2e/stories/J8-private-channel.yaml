id: J8
title: "초대받지 않은 비공개 채널"
personas: [P2, P4, P6]
steps:
  - as: P2
    act: channel.create
    on: desktop
    with: { visibility: private }
    expect: "비공개 채널이 선다"
  - as: P4
    act: ui.notSee
    on: desktop
    target: "private-channel"
    expect: "목록에 없다"
  - as: P4
    act: api.denied
    on: api
    target: "GET /channels/:channel/messages"
    with: { code: forbidden }
    expect: "멤버십 문에서 403 forbidden"
  - as: P2
    act: channel.invite
    on: desktop
    target: "P4"
    expect: "초대하면 실시간으로 목록에 생긴다"
expect: "멤버가 아니면 보이지도 읽히지도 않고, 초대되면 바로 보인다"
failSigns:
  - "목록에 이름이 보임"
  - "링크로 열면 내용이 보임"
  - "초대 뒤 재시작해야 보임"
existing:
  - kind: server-vitest
    file: "packages/server/test/storyJourneys.test.ts"
    note: "API 여정 러너가 이 여정을 그대로 돈다(화면 단계는 /auth/me capabilities 로 옮겨 보거나 건너뜀)"
  - kind: server-vitest
    file: "packages/server/test/membershipGate.test.ts"
    note: "멤버십 판정"
  - kind: server-vitest
    file: "packages/server/test/channelOwnership.test.ts"
    note: "채널 소유"
  - kind: browser-playwright
    file: "packages/e2e/web/journeys.pw.ts"
    note: "대체(브라우저): 화면 여정 러너가 이 여정의 화면 단계를 돈다(권한·역할·초대는 API 로)"
runners: [api, browser]
