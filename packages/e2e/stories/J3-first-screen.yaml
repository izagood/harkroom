    act: api.denied
    on: api
    target: "POST /accounts/agents"
    expect: "403"
expect: "할 수 없는 버튼은 안 보이고, 보이는 버튼은 누르면 된다"
failSigns:
  - "눌렀는데 403"
  - "관리자용 빈 상태 안내가 보임"
existing:
