id: J3
title: "처음 쓰는 멤버의 첫 화면"
personas: [P4]
steps:
  - as: P4
    act: login
    on: desktop
    expect: "주 화면이 뜬다"
  - as: P4
    act: ui.notSee
    on: desktop
    target: "agent-create"
    expect: "권한 없는 [+ 에이전트] 는 보이지 않거나 사유와 함께 잠겨 있다"
  - as: P4
    act: ui.notSee
    on: desktop
    target: "channel-create"
    expect: "권한 없는 [+ 채널] 은 보이지 않는다"
  - as: P4
    act: message.send
    on: desktop
    target: "general"
    expect: "첫 글이 선다"
  - as: P4
    act: api.denied
    on: api
    target: "POST /accounts/agents"
    expect: "403"
expect: "할 수 없는 버튼은 안 보이고, 보이는 버튼은 누르면 된다"
failSigns:
  - "눌렀는데 403"
  - "관리자용 빈 상태 안내가 보임"
existing:
  - kind: server-vitest
    file: "packages/server/test/storyJourneys.test.ts"
    note: "API 여정 러너가 이 여정을 그대로 돈다(화면 단계는 /auth/me capabilities 로 옮겨 보거나 건너뜀)"
  - kind: desktop-vitest
    file: "packages/desktop/test/agentCreateGate.test.tsx"
    note: "컴포넌트 단위 게이트(#1613)"
  - kind: browser-playwright
    file: "packages/e2e/web/permissions.pw.ts"
    note: "대체(브라우저): admin·member·guest 가 각자 로그인해 [+ 채널] 차이를 본다"
runners: [api, browser]
