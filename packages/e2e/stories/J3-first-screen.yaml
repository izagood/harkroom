id: J3
title: "처음 쓰는 멤버의 첫 화면"
personas: [P4]
steps:
  - as: P4
    act: login
    on: desktop
    expect: "주 화면이 뜬다"
  - as: P4
    act: ui.notSee
    on: desktop
    target: "agent-create"
    expect: "권한 없는 [+ 에이전트] 는 보이지 않거나 사유와 함께 잠겨 있다"
