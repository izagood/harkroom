id: J1
title: "호스팅 테넌트를 처음 연다"
personas: [P1]
steps:
  - as: P1
    act: tenant.claim
    on: api
    expect: "claim 토큰으로 첫 관리자 계정이 만들어진다"
  - as: P1
    act: login
    on: desktop
    expect: "주 화면이 뜬다"
  - as: P1
    act: channel.open
    on: desktop
    target: "general"
    expect: "첫 채널이 있다"
expect: "P1 이 owner 로 들어와 첫 채널에서 말할 수 있다"
failSigns:
  - "invalid_claim 404"
  - "/bootstrap 409 또는 401"
  - "빈 사이드바"
runners: [manual]
gaps:
  - "옛 TS 서버 시험(server-vitest·API 여정 러너)은 TS 백엔드 삭제로 없어졌다 — Rust 시험으로 옮기지 않은 판정은 여기서 빈다"
  - "gate(테넌트 발급·회수)는 이 저장소 밖이라 시험이 없다"
