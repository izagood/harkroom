id: J4
title: "권한을 받으면 재시작 없이 보인다"
personas: [P2, P4]
steps:
  - as: P4
    act: ui.notSee
    on: desktop
    target: "agent-create"
    expect: "처음엔 [+ 에이전트] 가 없다"
  - as: P2
    act: grant.give
    on: desktop
    target: "P4"
    with: { capability: agent.create }
    expect: "멤버 화면에 반영된다"
  - as: P4
    act: ui.see
    on: desktop
    target: "agent-create"
    with: { withinSec: 10 }
    expect: "앱을 껐다 켜지 않아도 버튼이 생긴다"
  - as: P4
    act: ui.see
    on: mobile
    target: "me-role"
    with: { withinSec: 10 }
    expect: "모바일도 재시작 없이 바뀐다"
  - as: P2
    act: grant.revoke
    on: desktop
    target: "P4"
    with: { capability: agent.create }
    expect: "거둔다"
  - as: P4
    act: ui.notSee
    on: desktop
    target: "agent-create"
    with: { withinSec: 10 }
    expect: "버튼이 사라진다"
expect: "grant 를 주고 거두는 것이 열린 화면에 몇 초 안에 반영된다"
failSigns:
  - "⌘Q 재시작 뒤에야 보임"
  - "모바일에 옛 상태가 남음"
existing:
  - kind: server-vitest
    file: "packages/server/test/storyJourneys.test.ts"
    note: "API 여정 러너가 이 여정을 그대로 돈다(화면 단계는 /auth/me capabilities 로 옮겨 보거나 건너뜀)"
  - kind: server-vitest
    file: "packages/server/test/grantRoutes.test.ts"
    note: "grant 주기·거두기와 grant.changed 신호"
  - kind: desktop-vitest
    file: "packages/desktop/test/agentCreateGate.test.tsx"
    note: "게이트 판정"
  - kind: browser-playwright
    file: "packages/e2e/web/journeys.pw.ts"
    note: "대체(브라우저): 화면 여정 러너가 이 여정의 화면 단계를 돈다(권한·역할·초대는 API 로)"
runners: [api, browser, mobile]
gaps:
  - "모바일 실기기 회차가 아직 없다 — grant.changed 처리(#1624)는 integration_test 로만 봤다(시험 테넌트가 생기면 실물로)"
