id: J9
title: "게스트는 전역 grant 가 있어도 막힌다"
personas: [P2, P6]
steps:
  - as: P2
    act: grant.give
    on: api
    target: "P6"
    with: { capability: channel.create }
    expect: "줄 수는 있다"
  - as: P6
    act: api.denied
    on: api
    target: "POST /channels"
    with: { code: forbidden }
    expect: "게스트의 실효 권한에서 전역 grant 는 빠진다"
  - as: P6
    act: ui.notSee
    on: desktop
    target: "channel-create"
    expect: "버튼도 없다"
expect: "게스트에게 화면과 서버가 같은 답을 한다"
failSigns:
  - "버튼은 보이는데 403"
  - "게스트가 채널을 만듦"
existing:
  - kind: browser-playwright
    file: "packages/e2e/web/journeys.pw.ts"
    note: "대체(브라우저): 화면 여정 러너가 이 여정의 화면 단계를 돈다(권한·역할·초대는 API 로)"
runners: [browser]
gaps:
  - "옛 TS 서버 시험(server-vitest·API 여정 러너)은 TS 백엔드 삭제로 없어졌다 — Rust 시험으로 옮기지 않은 판정은 여기서 빈다"
