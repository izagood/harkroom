services:
  postgres:
    # 벡터 검색을 쓰려면 pgvector 가 든 이미지로 바꾼다(HARKROOM_DB_IMAGE=pgvector/pgvector:0.8.7-pg16). **있던 볼륨을 그대로
    # 갈아 끼우지 않는다** — alpine(musl)과 debian(glibc)은 글 정렬이 달라 색인이 어긋난다. 덤프·복원으로 옮긴다
    # (docs/operations.md 6-1).
    image: ${HARKROOM_DB_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: harkroom
      POSTGRES_PASSWORD: harkroom
      POSTGRES_DB: harkroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harkroom -d harkroom"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # avcs 서버는 별도 프로세스로 구동하고 AVCS_BASE_URL로 연결한다. 프로토콜 스펙 구현 서버가
  # 공개되면 세 번째 서비스로 추가 예정.
  server:
    # **Rust 서버(`harkroom-server-rs`)를 가리킨다**(2026-11-21 — TS 서버를 걷어 내는 중이라 TS 이미지는 더 쓰지 않는다).
    # 태그를 안 주면 `latest` 이고, 배포에서는 버전으로 핀하는 것이 맞다 — 되돌리기가 "이 숫자를 전 릴리스로
    # 바꿔 다시 올린다"가 되기 때문이다.
    #
    #   HARKROOM_SERVER_TAG=<버전> docker compose -p <프로젝트> pull server
    #   HARKROOM_SERVER_TAG=<버전> docker compose -p <프로젝트> up -d --no-deps server
    #
    # **`build:` 를 지우지 않는 이유**: 개발·CI(e2e-web)에서는 여기서 굽는다. 둘이 함께 있으면
    # `docker compose build` 가 **이 이름으로 태그**하므로 그 뒤의 `up` 은 방금 만든 로컬 것을 쓴다
    # (레지스트리를 보지 않는다). 공식 이미지를 원하면 `pull` 을 먼저 부른다 — 위 두 줄이 그것이다.
    image: ghcr.io/izagood/harkroom-server-rs:${HARKROOM_SERVER_TAG:-latest}
    build:
      context: .
      dockerfile: crates/harkroom-server/Dockerfile
      args:
        # 도는 서버가 정확히 무슨 코드인지를 `/healthz` 가 말하게 한다(#693). 비워 두면 커밋은 `null` 이다.
        HARKROOM_COMMIT: ${HARKROOM_COMMIT:-}
    environment:
      # 이 compose 는 한 역할(postgres 의 harkroom)로 읽기·쓰기·마이그레이션을 다 한다 — 권한 확인이 늘 통과한다.
      # 운영처럼 역할을 나누면 쓰기 역할에 GRANT 가 모자랄 때 그 줄이 꺼진다(`HARKROOM_REQUIRE_GRANTS=1` 이면 기동 거부).
      DATABASE_URL: postgres://harkroom:harkroom@postgres:5432/harkroom
      DATABASE_WRITE_URL: postgres://harkroom:harkroom@postgres:5432/harkroom
      # 마이그레이션은 서버가 기동하며 돌린다(옛 TS 서버가 하던 일). DDL 이 되는 역할이어야 한다.
      HARKROOM_RUST_MIGRATE: "1"
      DATABASE_MIGRATE_URL: postgres://harkroom:harkroom@postgres:5432/harkroom
      # 코어(`/ws`·MCP·오퍼레이터)를 Rust 가 답한다. 넘길 TS 가 없으므로 끄면 그 줄들은 닫힌다.
      HARKROOM_CORE: rust
      # 「내 작업」 보드·`delegation.close` 등 위임 v2. 없으면 그 줄은 404·`unsupported_call` 로 닫힌다.
      HARKROOM_DELEGATION_V2: "1"
      # 이미지 기본은 3500 이다 — 옛 TS 서버와 같은 3400 으로 연다(데스크톱·e2e 가 이 주소를 쓴다).
      PORT: "3400"
      AVCS_BASE_URL: ${AVCS_BASE_URL:-}
      # 첨부 저장소. 이 경로는 이미지가 uid 65532(nonroot) 소유로 만들어 둔다 — 볼륨이 그 소유를 물려받는다.
      ATTACHMENT_ROOT: /var/lib/harkroom/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
      # 기억 벡터 검색의 임베딩 서비스. 비우면(기본) 낱말 검색만 쓴다. 켜려면 아래 `embed` 절을 본다.
      HARKROOM_EMBED_URL: ${HARKROOM_EMBED_URL:-}
    volumes:
      # 첨부 파일. 백업은 **이 볼륨을 먼저** 뜬 다음 DB 를 떠야 한다 — 반대 순서면 행이 가리키는 파일이 백업에
      # 없어 복구 후 '깨진 첨부'가 된다. 볼륨을 먼저 뜨면 그 사이 생긴 파일이 DB 에 없을 뿐이다(고아 파일, 무해).
      #
      # **옛 TS 서버(uid 1000)로 첨부를 쌓은 배포는 한 번 소유자를 넘겨야 한다**(Rust 이미지는 uid 65532):
      #   docker compose stop server
      #   docker run --rm -v <프로젝트>_attachments:/d alpine chown -R 65532:65532 /d
      #   docker compose start server
      # 안 넘기면 업로드가 실패한다(읽기는 된다 — 그래서 늦게 드러난다). 이 명령은 **볼륨 전체**의 소유자를 바꾼다 —
      # 그 볼륨을 다른 서비스와 같이 쓴다면 첨부 폴더만 바꾼다(README 「Deployment notes」).
      - attachments:/var/lib/harkroom/attachments
    networks: [default, embed]
    ports:
      - "3400:3400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  # 기억 벡터 검색의 임베딩 서비스(bge-m3 int8). 이미지가 크고 메모리를 1~1.5GB 쓰므로 **기본으로는 뜨지 않는다**:
  #   HARKROOM_EMBED_URL=http://embed:8080 docker compose --profile embed up -d
  # 운영에서는 태그를 고정한다(`HARKROOM_EMBED_TAG=sha-<7자>`) — `latest` 는 바뀐다.
  # 포트를 밖으로 열지 않는다 — 인증이 없고 기억 본문이 오간다. 준비 전·장애 중에는 서버가 낱말 검색만 쓴다.
  embed:
    profiles: ["embed"]
    image: ghcr.io/izagood/harkroom-embed:${HARKROOM_EMBED_TAG:-latest}
    build:
      context: .
      dockerfile: ops/embed/Dockerfile
    environment:
      EMBED_THREADS: "4"
    cpus: 4
    mem_limit: 2g
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    # DB 에도 밖에도 닿지 않는다 — server 만 이 네트워크에 같이 있다.
    networks: [embed]
    restart: unless-stopped
networks:
  default:
  embed:
    internal: true
volumes:
  pgdata:
  attachments:
