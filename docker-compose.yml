services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harkroom
      POSTGRES_PASSWORD: harkroom
      POSTGRES_DB: harkroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harkroom -d harkroom"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # avcs 서버는 별도 프로세스로 구동하고 AVCS_BASE_URL로 연결한다. 프로토콜 스펙 구현 서버가
  # 공개되면 세 번째 서비스로 추가 예정.
  server:
    # **공식 이미지를 가리킨다**(2026-09-14). 태그를 안 주면 `latest` 이고, 배포에서는
    # 버전으로 핀하는 것이 맞다 — 되돌리기가 "이 숫자를 전 릴리스로 바꿔 다시 올린다"가
    # 되기 때문이다. `rollback-<날짜>` 같은 로컬 태그를 손으로 만들어 두는 것보다 튼튼하다.
    #
    #   HARKROOM_SERVER_TAG=0.1.209 docker compose -p <프로젝트> pull server
    #   HARKROOM_SERVER_TAG=0.1.209 docker compose -p <프로젝트> up -d --no-deps server
    #
    # **`build:` 를 지우지 않는 이유**: 개발에서는 여전히 여기서 빌드한다. 둘이 함께 있으면
    # `docker compose build` 가 **이 이름으로 태그**하므로 그 뒤의 `up` 은 방금 만든 로컬
    # 것을 쓴다(레지스트리를 보지 않는다). 공식 이미지를 원하면 `pull` 을 먼저 부른다 —
    # 위 두 줄이 그것이다. 이미지가 로컬에 아예 없으면 `up` 이 알아서 빌드한다.
    image: ghcr.io/izagood/harkroom-server:${HARKROOM_SERVER_TAG:-latest}
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      args:
        # 도는 서버가 정확히 무슨 코드인지를 `/healthz` 가 말하게 한다(#693). 비워 두면
        # 버전·기동 시각만 뜨고 커밋은 `null` 이다 — 빌드가 실패하지는 않는다.
        # **손으로 빌드해 배포하면 이것을 빠뜨리기 쉽다**(2026-09-14 실측: 도는 배포가
        # `commit: null` 이었다). 공식 이미지는 CI 가 항상 심어 준다 — 이것도 `pull` 쪽을
        # 권하는 이유다.
        HARKROOM_COMMIT: ${HARKROOM_COMMIT:-}
    environment:
      DATABASE_URL: postgres://harkroom:harkroom@postgres:5432/harkroom
      AVCS_BASE_URL: ${AVCS_BASE_URL:-}
      # ATTACHMENT_ROOT 는 **이미지 기본값**(/var/lib/harkroom/attachments)을 쓴다. 여기서
      # 다시 적으면 이미지가 uid 1000 소유로 만들어 둔 그 디렉터리와 어긋날 수 있다.
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
    volumes:
      # 첨부 파일. 백업은 **이 볼륨을 먼저** 뜬 다음 DB 를 떠야 한다 — 반대 순서면 행이
      # 가리키는 파일이 백업에 없어 복구 후 '깨진 첨부'가 된다. 볼륨을 먼저 뜨면 그 사이
      # 생긴 파일이 DB 에 없을 뿐이고(고아 파일) 그건 무해하다.
      #
      # 경로가 `/var/lib/harkroom/attachments` 에서 바뀌었다(2026-09-12). **볼륨은 같은 것**이라
      # 파일은 따라온다. 다만 그 안의 파일들은 root 가 쓴 것이고 서버는 이제 uid 1000 으로
      # 도므로, **이미 첨부가 쌓인 배포는 한 번 소유자를 넘겨야 한다**:
      #   docker compose stop server
      #   docker run --rm -v <프로젝트>_attachments:/d alpine chown -R 1000:1000 /d
      #   docker compose start server
      # 안 넘기면 업로드가 EACCES 로 실패한다(읽기는 된다 — 그래서 늦게 드러난다).
      - attachments:/var/lib/harkroom/attachments
    ports:
      - "3400:3400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  attachments:
