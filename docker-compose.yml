services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: murmur
      POSTGRES_DB: murmur
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur -d murmur"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # avcs 서버는 별도 프로세스로 구동하고 AVCS_BASE_URL로 연결한다. 프로토콜 스펙 구현 서버가
  # 공개되면 세 번째 서비스로 추가 예정.
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      args:
        # 도는 서버가 정확히 무슨 코드인지를 `/healthz` 가 말하게 한다(#693). 비워 두면
        # 버전·기동 시각만 뜨고 커밋은 `null` 이다 — 빌드가 실패하지는 않는다.
        MURMUR_COMMIT: ${MURMUR_COMMIT:-}
    environment:
      DATABASE_URL: postgres://murmur:murmur@postgres:5432/murmur
      AVCS_BASE_URL: ${AVCS_BASE_URL:-}
      # ATTACHMENT_ROOT 는 **이미지 기본값**(/var/lib/harkroom/attachments)을 쓴다. 여기서
      # 다시 적으면 이미지가 uid 1000 소유로 만들어 둔 그 디렉터리와 어긋날 수 있다.
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
    volumes:
      # 첨부 파일. 백업은 **이 볼륨을 먼저** 뜬 다음 DB 를 떠야 한다 — 반대 순서면 행이
      # 가리키는 파일이 백업에 없어 복구 후 '깨진 첨부'가 된다. 볼륨을 먼저 뜨면 그 사이
      # 생긴 파일이 DB 에 없을 뿐이고(고아 파일) 그건 무해하다.
      #
      # 경로가 `/var/lib/murmur/attachments` 에서 바뀌었다(2026-09-12). **볼륨은 같은 것**이라
      # 파일은 따라온다. 다만 그 안의 파일들은 root 가 쓴 것이고 서버는 이제 uid 1000 으로
      # 도므로, **이미 첨부가 쌓인 배포는 한 번 소유자를 넘겨야 한다**:
      #   docker compose stop server
      #   docker run --rm -v <프로젝트>_attachments:/d alpine chown -R 1000:1000 /d
      #   docker compose start server
      # 안 넘기면 업로드가 EACCES 로 실패한다(읽기는 된다 — 그래서 늦게 드러난다).
      - attachments:/var/lib/harkroom/attachments
    ports:
      - "3400:3400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  attachments:
