name: Rust crates

# `crates/*` 는 Rust 전환(S1·S3a…)의 독립 crate 들이다 — 아직 앱·러너에 연결되지 않아 `CI` 의 어느 잡도 이것을 빌드하지 않는다.
# crate 마다 따로 `cargo test --locked` 를 돈다(작업 공간을 두지 않는 이유: `packages/desktop/src-tauri` 위 디렉터리에
# `[workspace]` 가 생기면 그 crate 가 「작업 공간 밖」 오류로 깨진다). 정본(TS)이 쓴 골든을 읽는 시험이 여기서 돈다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-crates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/*/target
          key: crates-${{ runner.os }}-${{ hashFiles('crates/*/Cargo.lock') }}
      - name: cargo fmt · clippy · test (crate 마다)
        run: |
          set -euo pipefail
          for m in crates/*/Cargo.toml; do
            echo "::group::$m"
            cargo fmt --manifest-path "$m" --check
            cargo clippy --manifest-path "$m" --locked --all-targets -- -D warnings
            cargo test --manifest-path "$m" --locked
            echo "::endgroup::"
          done
      - name: 서버 ↔ UI 생성 타입(ts-rs)이 커밋된 것과 같은가
        # 위 `cargo test` 가 `crates/harkroom-server` 의 `p6_bindings` 시험으로 `packages/shared/src/generated/` 를 다시 쓴다.
        # 달라졌거나 새 파일이 생겼으면 Rust 타입만 고치고 생성 파일을 안 올린 것이다.
        run: |
          set -euo pipefail
          out=$(git status --porcelain -- packages/shared/src/generated)
          if [ -n "$out" ]; then
            echo "::error::packages/shared/src/generated 가 Rust 타입과 다르다 — crates/harkroom-server 에서 cargo test 를 돌려 생성 파일을 커밋하라"
            echo "$out"
            git diff -- packages/shared/src/generated
            exit 1
          fi

  # 버스 경유 이벤트 순서 — 끝에서 끝(S5.1d). Rust 쓰는 쪽(`harkroom-bus` 의 `publish_lines` 예제)을 빌드하고, TS 서버 + 실제 WS 로
  # 커밋 순서대로 도착하는지 본다(`packages/server/test/eventBusRustE2e.test.ts`). `CI` 의 `check` 잡은 이 바이너리를 빌드하지 않아 그 시험을 건너뛴다.
  # Postgres 는 서버 시험과 같이 testcontainers 가 띄운다(ubuntu 러너에 Docker 가 있다).
  bus-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/harkroom-bus/target
          key: bus-e2e-${{ runner.os }}-${{ hashFiles('crates/harkroom-bus/Cargo.lock') }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --manifest-path crates/harkroom-bus/Cargo.toml --locked --example publish_lines
      - name: Rust 가 커밋한 순서대로 WS 에 도착하는가
        run: pnpm --filter @harkroom/server exec vitest run test/eventBusRustE2e.test.ts
        env:
          HARKROOM_BUS_PUBLISH_BIN: ${{ github.workspace }}/crates/harkroom-bus/target/debug/examples/publish_lines
          # 바이너리가 없어 건너뛰면 통과로 보이므로, 이 잡에서는 건너뛰기를 실패로 친다.
          HARKROOM_BUS_E2E_REQUIRED: '1'
