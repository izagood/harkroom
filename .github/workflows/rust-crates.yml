name: Rust crates

# `crates/*` 는 Rust 전환(S1·S3a…)의 독립 crate 들이다 — 아직 앱·러너에 연결되지 않아 `CI` 의 어느 잡도 이것을 빌드하지 않는다.
# crate 마다 따로 `cargo test --locked` 를 돈다(작업 공간을 두지 않는 이유: `packages/desktop/src-tauri` 위 디렉터리에
# `[workspace]` 가 생기면 그 crate 가 「작업 공간 밖」 오류로 깨진다). 정본(TS)이 쓴 골든을 읽는 시험이 여기서 돈다.
on:
  pull_request:
  # merge queue 의 임시 브랜치에서도 돈다(`ci.yml` 의 같은 줄 참고).
  merge_group:
  push:
    branches: [main]

concurrency:
  group: rust-crates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/*/target
          key: crates-${{ runner.os }}-${{ hashFiles('crates/*/Cargo.lock') }}
      - name: cargo fmt · clippy · test (crate 마다)
        run: |
          set -euo pipefail
          for m in crates/*/Cargo.toml; do
            echo "::group::$m"
            cargo fmt --manifest-path "$m" --check
            cargo clippy --manifest-path "$m" --locked --all-targets -- -D warnings
            cargo test --manifest-path "$m" --locked
            echo "::endgroup::"
          done
      - name: 서버 ↔ UI 생성 타입(ts-rs)이 커밋된 것과 같은가
        # 위 `cargo test` 가 `crates/harkroom-server` 의 `p6_bindings` 시험으로 `packages/shared/src/generated/` 를 다시 쓴다.
        # 달라졌거나 새 파일이 생겼으면 Rust 타입만 고치고 생성 파일을 안 올린 것이다.
        run: |
          set -euo pipefail
          out=$(git status --porcelain -- packages/shared/src/generated)
          if [ -n "$out" ]; then
            echo "::error::packages/shared/src/generated 가 Rust 타입과 다르다 — crates/harkroom-server 에서 cargo test 를 돌려 생성 파일을 커밋하라"
            echo "$out"
            git diff -- packages/shared/src/generated
            exit 1
          fi

  # Rust 서버의 DB 시험(`tests/<이름>.rs`)을 TS 없이 돈다 — 틀 DB 는 Rust 마이그레이션 실행기가 만들고, 쓰기 풀을 쓰는 시험은
  # 그 루프의 `*_PRIVILEGES` 만 가진 역할로 돈다(`crates/harkroom-server/scripts/db-tests.sh`). TS 백엔드를 지우면 아래 `bus-e2e` 가
  # 하던 이 일을 여기서 맡는다(그때까지는 두 곳에서 돈다).
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harkroom
          POSTGRES_PASSWORD: harkroom
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harkroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/harkroom-server/target
          key: db-tests-${{ runner.os }}-${{ hashFiles('crates/harkroom-server/Cargo.lock') }}
      - run: cargo build --manifest-path crates/harkroom-server/Cargo.toml --locked --bin harkroom-server-rs
      # 시험 바이너리를 먼저 지어 둔다 — 아래 스크립트가 시험마다 컴파일을 기다리지 않게.
      - run: cargo test --manifest-path crates/harkroom-server/Cargo.toml --locked --no-run
      - name: Rust DB 시험(실제 스키마·좁은 쓰기 역할)
        run: crates/harkroom-server/scripts/db-tests.sh
        env:
          PGADMIN_URL: postgres://harkroom:harkroom@127.0.0.1:5432/postgres
          SERVER_BIN: ${{ github.workspace }}/crates/harkroom-server/target/debug/harkroom-server-rs

  # 버스 경유 이벤트 순서 — 끝에서 끝(S5.1d). Rust 쓰는 쪽(`harkroom-bus` 의 `publish_lines` 예제)을 빌드하고, TS 서버 + 실제 WS 로
  # 커밋 순서대로 도착하는지 본다(`packages/server/test/eventBusRustE2e.test.ts`). `CI` 의 `check` 잡은 이 바이너리를 빌드하지 않아 그 시험을 건너뛴다.
  # Postgres 는 서버 시험과 같이 testcontainers 가 띄운다(ubuntu 러너에 Docker 가 있다).
  bus-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/harkroom-bus/target
            crates/harkroom-server/target
          key: bus-e2e-${{ runner.os }}-${{ hashFiles('crates/harkroom-bus/Cargo.lock', 'crates/harkroom-server/Cargo.lock') }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --manifest-path crates/harkroom-bus/Cargo.toml --locked --example publish_lines
      # 시험 바이너리를 먼저 지어 둔다 — 아래 vitest 시험의 제한 시간 안에서 컴파일하지 않게.
      - run: cargo test --manifest-path crates/harkroom-server/Cargo.toml --locked --no-run
      # 두 파일을 **한 번의 vitest** 로 돌린다. 따로 돌리면 둘째 실행의 testcontainers 가 첫 실행이 남긴 Ryuk(정리 컨테이너)를
      # 다시 쓰려다, 연결이 끊긴 뒤 ~10초 안에 스스로 내려가는 그 Ryuk 에 붙지 못해 `Failed to connect to Reaper` 로 죽는다
      # (두 실행 사이가 10초 안쪽일 때만 — 캐시가 맞아 cargo 가 빨리 끝나면 난다).
      - name: Rust 버스 순서 + Rust 앞단이 실제 스키마에서 TS 와 같은가(tests/auth.rs·perm.rs 판정 + tests/contrast.rs 대조)
        run: pnpm --filter @harkroom/server exec vitest run test/eventBusRustE2e.test.ts test/rustFrontDb.test.ts
        env:
          HARKROOM_BUS_PUBLISH_BIN: ${{ github.workspace }}/crates/harkroom-bus/target/debug/examples/publish_lines
          # 바이너리가 없어 건너뛰면 통과로 보이므로, 이 잡에서는 건너뛰기를 실패로 친다.
          HARKROOM_BUS_E2E_REQUIRED: '1'
          HARKROOM_RUST_DB_TESTS: '1'
