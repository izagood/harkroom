name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # 서버 테스트가 testcontainers로 Postgres를 띄운다 — Docker가 있는 러너여야 한다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # argon2 등 네이티브 모듈 빌드는 pnpm-workspace.yaml 의 allowBuilds 에 걸려 있다.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
