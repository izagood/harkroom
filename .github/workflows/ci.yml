name: CI

on:
  pull_request:
  push:
    branches: [main]
  # PR 을 열지 않은 브랜치에서도 macOS 빌드를 돌려 볼 수 있어야 한다 — 이 잡을 처음 검증한
  # 방법이기도 하다(`gh workflow run CI --ref <브랜치>`). 번들 관련 작업은 PR 을 만들기 전에
  # 확인하고 싶은 것이 보통이라, 검증이 끝난 뒤에도 남겨 둔다.
  workflow_dispatch:

# macOS 러너는 리눅스보다 비싸다(과금 배수가 붙는다) — 같은 PR 에 새 커밋이 올라오면 옛 실행을
# 취소하는 것이 합리적이다. 다만 **main 푸시는 취소하면 안 된다**: main 의 빌드는 "이 커밋이
# 실제로 빌드되는가"의 유일한 기록이고, 연달아 머지될 때 앞 커밋의 실행이 취소되면 그 커밋에서
# 들어온 회귀가 아무 데도 안 잡힌 채 지나간다. 그래서 group 은 ref 별로 나누되
# cancel-in-progress 는 push 이벤트에서만 끈다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  check:
    # 서버 테스트가 testcontainers로 Postgres를 띄운다 — Docker가 있는 러너여야 한다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 액션은 40자 커밋 SHA 로 핀한다. 태그(`@v7`)는 옮길 수 있는 포인터라 같은 워크플로가
      # 어느 날 다른 코드를 돌린다 — 공급망 사고의 표준 경로다. 뒤의 주석이 사람이 읽을
      # 버전이고, 핀 자체는 **지금 `@v7` 이 가리키던 바로 그 커밋**이다(버전은 안 바뀐다).
      #
      # ## 왜 한 번에 메이저를 올렸는가 (2026-09)
      #
      # 러너에서 Node.js 20 이 폐기됐다. 옛 핀(checkout/setup-node/cache `@v4`,
      # pnpm/action-setup `@v4`)은 모두 `using: node20` 이어서 러너가 Node 24 로 **강제
      # 실행하며** 매 실행마다 경고를 뿜었다 — 강제 실행은 임시 조치이고, 언젠가 그냥
      # 실패로 바뀐다. node24 런타임으로 넘어간 첫 메이저는 checkout v5 · setup-node v5 ·
      # cache v5 이고, 여기서는 그때의 최신 메이저로 올렸다. 확인한 것:
      #
      # - setup-node v6 의 breaking change 는 *자동* 캐시를 npm 으로 좁힌 것뿐이다.
      #   여기서는 `cache: pnpm` 을 명시하므로 영향이 없다(v7 에도 pnpm 값은 그대로 있다).
      # - checkout v7 이 막은 것은 `pull_request_target`·`workflow_run` 에서의 fork PR
      #   체크아웃이다. 이 저장소는 두 이벤트를 쓰지 않는다.
      # - pnpm/action-setup v6 은 pnpm v11 지원을 넣은 버전이다 — 아래 `version: 11` 과 맞다.
      #
      # 아래 `node-version: 22` 는 액션 런타임이 아니라 **빌드가 쓰는 Node** 다. 폐기와
      # 무관하므로 건드리지 않았다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # argon2 등 네이티브 모듈 빌드는 pnpm-workspace.yaml 의 allowBuilds 에 걸려 있다.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # ## 러너 이설을 지키는 잡 하나 (2026-09-11)
      #
      # 하네스 이설(`packages/agent/src/adapters/`)은 **옛 경로를 남기고 새 경로를 스위치
      # 뒤에 두는** 방식으로 간다 — 이 경로가 깨지면 에이전트가 안 돌고, 그러면 murmur
      # 자체를 못 쓰기 때문이다. 그래서 위 `pnpm test` 는 **옛 경로만** 검증한다(스위치가
      # 기본 꺼짐).
      #
      # 새 경로는 아무도 안 돌리면 조용히 썩는다. 전환하는 날 "이제 켜자"고 말할 근거가
      # 패리티 테스트 몇 개뿐이면 그 근거가 얇다 — **에이전트 스위트 전체가 양쪽에서 같이
      # 초록인 것**이 훨씬 두꺼운 근거다. 실측(2026-09-11): 두 모드가 762 passed 로 같았고
      # 실패 집합도 동일했다.
      #
      # 에이전트 패키지만 다시 돈다(30초 남짓). 스위치를 기본 켜짐으로 돌리고 옛 분기를
      # 지우는 날 이 단계도 함께 지운다 — 그때는 `pnpm test` 하나가 곧 새 경로다.
      - run: pnpm --filter @harkroom/agent test
        env:
          MURMUR_HARNESS_ADAPTERS: '1'

  macos-build:
    # ## 왜 이 잡이 있는가 — `cargo check` 도 `pnpm test` 도 못 잡는 것이 있다
    #
    # 위 `check` 잡은 리눅스에서 typecheck + 테스트만 돈다. 그것으로 안 잡히고 **릴리스
    # 번들을 실제로 말아야만** 드러나는 고장이 이미 여러 번 나왔다:
    #
    # - `tauri-plugin-notification` 의 크레이트/JS 버전 불일치(#440) — `cargo check` 는 통과했다.
    # - `build:sidecar` 를 잊으면 `resource path 'binaries/harkroom-runner-…' doesn't exist`(#441).
    # - macOS 에서만 통과하는 테스트(반대 방향도 마찬가지다).
    #
    # 그래서 이 잡의 질문은 하나다: **"macOS 에서 앱이 실제로 빌드되고, 그 안에 들어갈 것이
    # 다 들어갔는가."** 서명·공증은 하지 않는다 — 그것은 시크릿이 필요하고 릴리스 워크플로의
    # 일이다. `sign-app.mjs`/`notarize-app.mjs` 를 부르지 않는 것이 그 경계다(인증서가 없으면
    # ad-hoc 으로 물러나므로, 부르면 "서명했다"는 착시만 남는다).
    #
    # `macos-latest` 를 쓴다. GitHub 이 이 라벨을 옮길 때 함께 옮겨 가는 것이 목적에 맞다 —
    # 이 잡은 특정 SDK 버전을 재현하는 것이 아니라 "최신 macOS 에서 빌드가 깨지지 않는가"를
    # 묻는다. 릴리스 워크플로는 반대로 러너를 고정해야 하지만 그것은 별도의 일이다.
    runs-on: macos-latest
    # **콜드 캐시 실측 3분 8초**(잡 전체. `Cache not found` 를 로그로 확인했고, 그 중 Rust
    # 릴리스 빌드가 2분 10초였다 — Apple 실리콘 러너가 빠르다). 20분은 그 6배가 넘으므로
    # 의존이 늘거나 러너가 느려져도 여유가 있고, 그러면서도 뭔가 매달렸을 때 macOS 러너를
    # 한 시간씩 태우지 않는다. 실측이 이 숫자의 근거다 — 추측으로 크게 잡지 않는다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # Rust 릴리스 빌드가 이 잡의 대부분이다. 캐시 키는 **`Cargo.lock` 해시 기반이고
      # `restore-keys` 가 없다**. restore-keys 를 두면 키가 빗나갔을 때 *다른 lock* 으로
      # 만들어진 target 디렉터리를 끌어와 얹는다 — 그러면 이 잡이 검증한다고 주장하는 의존
      # 버전과 실제로 링크된 것이 갈릴 수 있다. #440 이 정확히 버전 불일치였다. 캐시가
      # 안 맞으면 그냥 처음부터 빌드하는 것이 맞다: 느린 것은 문제지만 틀린 것은 사고다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: macos-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # **사이드카가 `tauri build` 보다 반드시 앞이다.** `tauri.conf.json` 의 `externalBin` 이
      # `binaries/harkroom-runner`·`binaries/harkroom-daemon` 둘 다 요구하고, 없으면 번들 단계가
      # `resource path … doesn't exist` 로 죽는다(#441). 사람이 기억해야 하는 순서를 여기에
      # 못박는 것이 이 잡이 #441 을 닫는 방식이다.
      - run: pnpm --filter @harkroom/desktop build:sidecar

      # `--bundles app` — `.app` 만 만든다. dmg 는 이 잡의 질문("빌드가 되는가")에 아무것도
      # 더하지 않으면서 시간만 쓴다.
      #
      # ## `--config` 로 updater 산출물을 **이 잡에서만** 끈다
      #
      # `tauri.conf.json` 에 `bundle.createUpdaterArtifacts: true` 가 켜져 있다(앱 내부
      # 업데이트). 그런데 그 플래그는 **`--bundles app` 으로도 `.app.tar.gz` 를 만들고**,
      # 만들고 나면 서명하려 들어 개인키를 요구한다 — 실측(2026-09-07)으로 이 잡이
      # 정확히 이렇게 죽었다:
      #   `Error A public key has been found, but no private key.`
      #   `Make sure to set TAURI_SIGNING_PRIVATE_KEY environment variable.`
      # (`--bundles` 는 `targets` 를 고를 뿐이고, updater 산출물의 스위치는 그것과 별개인
      #  `createUpdaterArtifacts` 이기 때문이다.)
      #
      # **개인키를 이 잡에 넘기지 않는다.** 이 잡이 답하는 질문은 "빌드가 되는가"이고
      # 거기에 배포용 키가 필요할 이유가 없다. 넘기면 그 키가 닿는 표면만 넓어지고,
      # **fork PR 에는 시크릿이 가지 않으므로** 외부 기여자의 PR 마다 이 잡이 빨간 X 가 된다.
      # 더미 키를 즉석 생성하는 방법도 되지만, 아무도 안 쓸 서명을 만드느라 단계를 늘리는
      # 것보다 **애초에 만들지 않는 쪽**이 이 잡의 질문에 더 가깝다.
      #
      # `--config` 는 설정 파일 위에 얹는 JSON 이라 `tauri.conf.json` 을 건드리지 않는다 —
      # 릴리즈(`release.yml`)는 그 파일을 그대로 읽어 진짜 키로 서명한다.
      #
      # **이 잡의 검증은 그대로 산다**: 위 오류는 `.app` 번들링이 **끝난 뒤** 나던 것이라
      # 끄더라도 아래 산출물 검사(#441 사이드카 · #470 심볼릭 링크)의 입력은 달라지지 않는다.
      - run: >
          pnpm --filter @harkroom/desktop tauri build --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # ## exit 0 으로 끝내지 않는다 — 산출물을 연다
      #
      # `tauri build` 가 성공했다는 것과 배포 가능한 `.app` 이 나왔다는 것은 다른 명제다.
      # #441 류의 고장은 "빌드는 됐는데 앱 안에 사이드카가 없다"는 모양으로 나타난다.
      # 그래서 번들을 열어 **실제로 들어가야 할 넷**을 확인한다:
      #
      #   Contents/MacOS/harkroom-desktop           ← 본체
      #   Contents/MacOS/harkroom-runner            ← externalBin (하네스를 돌린다)
      #   Contents/MacOS/harkroom-daemon            ← externalBin (러너를 spawn 한다)
      #   Contents/Resources/node_modules/node-pty ← bundle.resources (러너가 PTY 를 연다)
      #
      # 마지막 항목이 `Resources/` 인 것은 Tauri 가 `bundle.resources` 를 거기 두기 때문이다.
      # 러너는 자기 위치에서 `../Resources/node_modules/node-pty` 를 계산해 해석한다
      # (`packages/agent/src/nodePtyLoader.ts`) — **번들에 링크를 만들지 않는다**(`#470`).
      # 예전에는 `ensure_node_pty_alongside_sidecar()` 가 사이드카 옆으로 링크했는데,
      # 그 링크가 `staple` 을 거절시켜(`invalid destination for symbolic link in bundle`)
      # 걷어냈다. 그러니 여기서 볼 자리는 `MacOS/` 가 아니라 `Resources/` 다.
      - name: 번들 산출물을 검증한다
        run: |
          set -euo pipefail
          app="packages/desktop/src-tauri/target/release/bundle/macos/Harkroom.app"
          test -d "$app" || { echo "::error::.app 이 없다: $app"; exit 1; }

          missing=0
          for f in \
            "$app/Contents/MacOS/harkroom-desktop" \
            "$app/Contents/MacOS/harkroom-runner" \
            "$app/Contents/MacOS/harkroom-daemon"
          do
            if [ -x "$f" ]; then
              echo "ok  $f"
            else
              echo "::error::실행 가능한 파일이 없다: $f"
              missing=1
            fi
          done

          pty="$app/Contents/Resources/node_modules/node-pty"
          if [ -d "$pty" ]; then
            echo "ok  $pty"
          else
            echo "::error::node-pty 리소스가 없다: $pty"
            missing=1
          fi

          # 번들 안에 심볼릭 링크가 없어야 한다(`#470`).
          #
          # `#433` 이 만들던 `Contents/MacOS/node_modules` 링크가 공증의 `staple` 을
          # 거절시켰다(`invalid destination for symbolic link in bundle`). 지금은 러너가
          # 자기 위치에서 `../Resources` 를 계산해 해석하므로 링크가 필요 없다.
          #
          # **위 `-d` 검사만으로는 이 회귀를 못 잡는다** — `-d` 는 심볼릭 링크를 따라가서,
          # 링크로 되돌아가도 통과한다. 그래서 링크 자체를 따로 센다.
          links=$(find "$app" -type l | wc -l | tr -d ' ')
          if [ "$links" = "0" ]; then
            echo "ok  심볼릭 링크 0개"
          else
            echo "::error::번들에 심볼릭 링크가 $links 개 있다 — staple 이 거절한다(#470)"
            find "$app" -type l
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "--- 번들 안을 펼친다 ---"
            find "$app/Contents" -maxdepth 3 -print
            exit 1
          fi
