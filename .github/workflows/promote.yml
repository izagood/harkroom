# 릴리즈 하나를 **Stable 채널로 승격**한다.
#
# ## 채널 둘
#
# - **Ludicrous** = 지금까지의 자동 업데이트 그대로. main 머지마다 `release.yml` 이 릴리즈를
#   내고 `make_latest` 로 못박으며, 업데이터는 `releases/latest/download/latest.json` 을 읽는다.
# - **Stable** = 이 워크플로가 고른 판. 돌려 쓰는 prerelease 하나(태그 `stable`)에
#   `latest.json` 만 두고, 업데이터는 `releases/download/stable/latest.json` 을 읽는다.
#
# ## 승격이 하는 일은 **매니페스트를 옮기는 것뿐**이다
#
# `vX` 릴리즈의 `latest.json` 은 이미 `vX` 의 `.app.tar.gz` URL 과 그 서명(`.sig` 내용)을
# 담고 있다. 그 파일을 그대로 `stable` 릴리즈에 올리면 된다 — **다시 굽지도, 다시 서명하지도
# 않는다.** 앱은 받은 tarball 을 `tauri.conf.json` 의 공개키로 검증하므로, 매니페스트가 어느
# 릴리즈에 놓였는지는 신뢰에 영향이 없다.
#
# 서버 이미지도 같다: `:X` 가 가리키는 매니페스트 리스트에 `:stable` 을 덧붙인다(다시 굽지 않는다).
# 운영 테넌트는 homelab 이 판 번호로 고정하므로 `:stable` 을 읽지 않는다 — 직접 운영하는
# 사람을 위한 이름표다.
#
# ## 왜 `stable` 릴리즈는 **prerelease** 인가
#
# GitHub 의 `releases/latest` 는 draft·prerelease 를 뺀 릴리즈다. `stable` 이 보통 릴리즈면
# 그것이 "Latest" 가 되어 Ludicrous 업데이터가 Stable 매니페스트를 읽게 된다. `release.yml`
# finalize 의 semver 최고 판정도 prerelease 를 뺀다 — 그래서 이 릴리즈는 그 판정에 끼지 않는다.
#
# ## 순서 (설계 합의)
#
# 같은 판 X 를 **서버 먼저**(homelab 판올림) → 그다음 이 워크플로로 데스크톱 Stable.
# 앱 vX 의 `MIN_SERVER_VERSION` 은 X 이하이므로, 서버가 X 이상이면 Stable 앱은 늘 붙는다.
#
# ## 판정 이슈
#
# 시험(docs/release-stable.md)을 통과한 판만 올린다. 이슈 `Stable 판정 vX` 에 `stable-verdict-pass` 이름표가
# 있어야 하고, 그 이름표를 마지막으로 붙인 사람이 지금 쓰기 권한 이상이어야 하며, 본문에 ❌ 가 없어야 한다.
# `allow_older` 로도 건너뛰지 않는다.
#
# ## 실행
#
#   gh workflow run promote.yml -R izagood/harkroom -f version=0.4.164
#
# 지금 Stable 보다 낮은 판은 거절한다(업데이터는 낮은 판으로 내려가지 않으므로 의미가 없고,
# 실수로 되돌린 것일 가능성이 높다). 정말 되돌려야 하면 `allow_older=true` 를 준다.
name: Stable 승격

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable 로 올릴 판(`0.4.164` — 앞의 v 없이)
        type: string
        required: true
      allow_older:
        description: 지금 Stable 보다 낮은 판도 허용한다(되돌릴 때만)
        type: boolean
        default: false

permissions:
  # `stable` 태그·릴리즈를 만들고 자산을 바꾼다.
  contents: write
  # ghcr 에 `:stable` 을 덧붙인다. `GITHUB_TOKEN` 으로 충분하다.
  packages: write
  # 판정 이슈(`Stable 판정 vX`)와 그 이름표를 붙인 사람을 읽는다.
  issues: read

# 승격 둘이 겹치면 매니페스트가 어느 쪽인지 알 수 없다 — 하나씩만 돈다.
concurrency:
  group: promote-stable
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/harkroom-server
  CHANNEL_TAG: stable

jobs:
  promote:
    name: v${{ inputs.version }} → Stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 입력과 원본 릴리즈를 확인한다
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ALLOW_OLDER: ${{ inputs.allow_older }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::판은 0.4.164 꼴이어야 한다(앞의 v 없이): $VERSION"
            exit 1
          fi
          tag="v$VERSION"

          # 공개된 보통 릴리즈만 승격한다. draft 는 finalize 를 못 넘은 것(검증 실패·기동 확인
          # 실패)이고, get-by-tag 는 draft 를 404 로 돌려주므로 여기서 함께 걸러진다.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null) || {
            echo "::error::공개된 릴리즈가 없다: $tag (draft 이거나 없는 판)"
            exit 1
          }
          if [ "$(jq -r .prerelease <<< "$release")" = "true" ]; then
            echo "::error::$tag 는 prerelease 다 — 승격 대상이 아니다"
            exit 1
          fi
          if ! jq -e '.assets[] | select(.name == "latest.json")' <<< "$release" >/dev/null; then
            echo "::error::$tag 에 latest.json 이 없다"
            exit 1
          fi

          # 지금 Stable 판(없으면 첫 승격).
          current=""
          # **404 일 때만 "첫 승격"이다.** 5xx·속도 제한 같은 다른 실패까지 "없음"으로 읽으면 견주기를
          # 건너뛴다 — 아래 「판을 못 읽으면 선다」가 막는 것과 같은 꼴의 구멍이다(#1529 security n2).
          stable_found=0
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHANNEL_TAG" >/dev/null 2>"$RUNNER_TEMP/stable-lookup.err"; then
            stable_found=1
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/stable-lookup.err"; then
            echo "::error::$CHANNEL_TAG 릴리즈가 있는지 확인하지 못했다(404 가 아닌 실패) — 지금 Stable 과 견줄 수 없어 선다. 잠시 뒤 다시 돌린다"
            cat "$RUNNER_TEMP/stable-lookup.err" >&2
            exit 1
          fi
          if [ "$stable_found" = 1 ]; then
            current=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$CHANNEL_TAG/latest.json" \
              | jq -r .version) || current=""
            # **릴리즈는 있는데 판을 못 읽으면 선다.** 그대로 두면 "첫 승격"으로 보고 되돌림 막기를
            # 건너뛴다(404·깨진 json·version 없음 모두 같은 모양이다). 사람이 지금 Stable 을 직접 보고
            # 그래도 올리겠다면 `allow_older=true` 로만 지나간다.
            if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # 원문은 워크플로 명령 줄에 실린다 — 줄바꿈을 없애고 앞 40자만(#1529 security n1).
              shown="${current//$'\n'/ }"; shown="${shown//$'\r'/ }"; shown="${shown:0:40}"
              if [ "$ALLOW_OLDER" != "true" ]; then
                echo "::error::$CHANNEL_TAG 릴리즈는 있는데 그 latest.json 에서 판을 읽지 못했다('${shown}'). 지금 Stable 과 견줄 수 없어 선다 — 확인한 뒤 진행하려면 allow_older=true"
                exit 1
              fi
              echo "::warning::$CHANNEL_TAG 의 판을 읽지 못했지만 allow_older=true 라 견주지 않고 진행한다"
              current=""
            fi
          fi
          echo "지금 Stable: ${current:-(없음)} → 올릴 판: $VERSION"
          if [ -n "$current" ] && [ "$ALLOW_OLDER" != "true" ]; then
            lowest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | head -1)
            if [ "$lowest" = "$VERSION" ] && [ "$current" != "$VERSION" ]; then
              echo "::error::$VERSION 은 지금 Stable($current)보다 낮다. 되돌리려면 allow_older=true"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      # 시험 없이 승격되는 것을 막는다(docs/release-stable.md 「판정 이슈」). 판정은 이 저장소의 이슈
      # `Stable 판정 vX` 에 `stable-verdict-pass` 이름표로 남긴다 — 이름표는 쓰기 권한이 있어야 붙일 수
      # 있지만, 권한이 나중에 줄었을 수도 있으니 **마지막으로 붙인 사람의 지금 권한**을 다시 본다.
      # `allow_older` 로도 건너뛰지 못한다: 되돌리기도 고친 판 X+1 의 승격이고, 그 판도 판정이 있어야 한다.
      - name: 판정 이슈를 확인한다
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          LABEL: stable-verdict-pass
        run: |
          set -euo pipefail
          title="Stable 판정 v$VERSION"
          # 검색 색인은 늦을 수 있다 — 이름표로 목록을 받아 제목을 정확히 맞춘다.
          issues=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?labels=$LABEL&state=all&per_page=100" \
            --jq "[.[] | select(.pull_request == null and .title == \"$title\") | .number]" | jq -s 'add // []')
          count=$(jq length <<< "$issues")
          if [ "$count" = 0 ]; then
            echo "::error::'$title' 이슈에 $LABEL 이름표가 없다 — 판정(docs/release-stable.md 3 단계) 뒤에 승격한다"
            exit 1
          fi
          if [ "$count" != 1 ]; then
            echo "::error::'$title' 이면서 $LABEL 인 이슈가 $count 개다 — 하나만 남긴다: $(jq -c . <<< "$issues")"
            exit 1
          fi
          number=$(jq -r '.[0]' <<< "$issues")

          # 마지막으로 그 이름표를 붙인 사람. 지금도 쓰기 이상이어야 한다.
          actor=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/events?per_page=100" \
            --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | .actor.login" | tail -1)
          if [ -z "$actor" ]; then
            echo "::error::#$number 에서 $LABEL 을 붙인 기록을 찾지 못했다"
            exit 1
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "::error::#$number 의 $LABEL 을 붙인 $actor 의 권한이 '$permission' 이다 — 쓰기 이상만 판정한다"
              exit 1
              ;;
          esac

          # 이름표가 있어도 본문에 ❌ 가 남아 있으면 판정이 끝나지 않은 것이다.
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '.body // ""')
          if grep -q '❌' <<< "$body"; then
            echo "::error::#$number 본문에 ❌ 항목이 남아 있다 — 고친 판으로 다시 시험하거나 표를 고친 뒤 승격한다"
            exit 1
          fi
          echo "판정: #$number ($LABEL, $actor · $permission)"
          echo "verdict=$number" >> "$GITHUB_OUTPUT"

      - name: 매니페스트를 받아 판을 대조한다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # checkout 이 없어 git 저장소가 없다 — `gh release` 는 `--repo` 를 꼭 준다(release.yml finalize 와 같은 이유).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$RUNNER_TEMP/manifest" --clobber
          manifest="$RUNNER_TEMP/manifest/latest.json"
          # 매니페스트가 그 판을 가리키는지, 그 릴리즈의 tarball 을 가리키는지 본다. 어긋나면
          # Stable 이 엉뚱한 판을 받는다 — 옮기기 전에 선다.
          got=$(jq -r .version "$manifest")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::latest.json 의 version($got)이 $VERSION 이 아니다"
            exit 1
          fi
          jq -e --arg prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            '.platforms | length > 0 and all(.[]; (.url | startswith($prefix)) and (.signature | length > 0))' \
            "$manifest" >/dev/null || {
              echo "::error::latest.json 의 플랫폼 항목이 $TAG 자산을 가리키지 않거나 서명이 비었다"
              jq . "$manifest"
              exit 1
            }

      # 액션은 40자 커밋 SHA 로 핀한다(image.yml 과 같은 판).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 서버 이미지에 :stable 을 덧붙인다
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 원본 판 이미지가 없으면 서지 않는다 — 데스크톱만 Stable 로 가고 서버 이름표는 낡는다.
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null
          docker buildx imagetools create --tag "${IMAGE}:${CHANNEL_TAG}" "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:${CHANNEL_TAG}"

      - name: stable 릴리즈에 매니페스트를 옮긴다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          # 주석 달린 태그면 커밋까지 내려간다(release.yml 의 태그는 가벼운 태그지만 가정하지 않는다).
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = "tag" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi

          notes="Harkroom **Stable** 채널 — 지금 판: [v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG).

          앱의 자동 업데이트가 이 릴리즈의 \`latest.json\` 을 읽는다. 설치 파일은 위 판 릴리즈에서 받는다.
          이 릴리즈는 \`Stable 승격\` 워크플로가 판마다 덮어쓴다."

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CHANNEL_TAG" >/dev/null 2>&1; then
            # 태그를 새 판 커밋으로 옮긴다(이 태그는 다른 워크플로를 깨우지 않는다 — testflight 는 mobile-v* 만 본다).
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$CHANNEL_TAG" \
              -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$CHANNEL_TAG" -f sha="$sha" >/dev/null
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHANNEL_TAG" >/dev/null 2>&1; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHANNEL_TAG" --jq .id)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f name="Harkroom Stable (v$VERSION)" -f body="$notes" \
              -F prerelease=true -f make_latest=false >/dev/null
          else
            gh release create "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Harkroom Stable (v$VERSION)" --notes "$notes" \
              --prerelease --latest=false --verify-tag
          fi

          # `--clobber` 는 지운 뒤 올린다 — 그 사이 몇 초 동안 Stable 확인이 404(「확인 실패」)일 수 있다.
          # 앱은 다음 확인에서 회복한다.
          gh release upload "$CHANNEL_TAG" "$RUNNER_TEMP/manifest/latest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: 공개 경로에서 다시 읽어 확인한다
        env:
          VERSION: ${{ inputs.version }}
          PREV: ${{ steps.check.outputs.current }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          set -euo pipefail
          # 앱이 실제로 읽는 URL 을 그대로 읽는다. CDN 반영이 늦을 수 있어 몇 번 기다린다.
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$CHANNEL_TAG/latest.json"
          for _ in 1 2 3 4 5 6; do
            got=$(curl -fsSL "$url" | jq -r .version) || got=""
            [ "$got" = "$VERSION" ] && break
            sleep 10
          done
          if [ "$got" != "$VERSION" ]; then
            echo "::error::$url 가 $VERSION 이 아니라 '${got}' 을 돌려준다"
            exit 1
          fi
          # 업데이터가 읽는 Ludicrous 쪽이 그대로인지도 본다 — stable 이 Latest 를 빼앗지 않았는지.
          latest=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" | jq -r .version)
          {
            echo "## Stable 승격"
            echo
            echo "| 채널 | 판 |"
            echo "|---|---|"
            echo "| Stable | ${PREV:-(없음)} → **$VERSION** |"
            echo "| Ludicrous (latest) | $latest |"
            echo "| 이미지 | \`${IMAGE}:${CHANNEL_TAG}\` = \`:$VERSION\` |"
            echo "| 판정 | #$VERDICT |"
          } >> "$GITHUB_STEP_SUMMARY"
