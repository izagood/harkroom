name: Mobile

# **`ci.yml` 에 잡을 더하지 않고 워크플로를 따로 둔다.** `ci.yml` 은 모든 PR 에서 돌고,
# 서버·데스크탑만 고친 PR 마다 1GB 대의 Flutter SDK 를 받아 올 이유가 없다. 대신 이
# 워크플로는 `mobile/` 이 바뀔 때만 깬다.
#
# 계획서: `docs/plans/2026-09-22-mobile-flutter.md` §9.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  # PR 을 열지 않은 브랜치에서도 iOS 빌드를 돌려 볼 수 있어야 한다 — `ci.yml` 이
  # macos-build 를 두고 내린 판단과 같다.
  workflow_dispatch:

# `ci.yml` 과 같은 규칙이다: 같은 PR 에 새 커밋이 올라오면 옛 실행을 취소하되,
# **main 푸시는 취소하지 않는다**(그 커밋이 실제로 빌드되는가의 유일한 기록이다).
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# 로컬과 CI 가 같은 SDK 를 쓰게 **정확한 버전으로 핀한다.** `stable` 만 적으면 어느 날
# 채널이 올라가면서 로컬에서 초록인 것이 CI 에서 빨개진다 — 그때 원인을 SDK 로 의심하는
# 사람은 아무도 없다.
env:
  FLUTTER_VERSION: 3.47.5

jobs:
  # 분석과 시험은 리눅스에서 돈다. 싸고 빠르며, Dart 코드에는 macOS 가 필요 없다.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 액션은 40자 커밋 SHA 로 핀한다 — 태그는 옮길 수 있는 포인터라 같은 워크플로가
      # 어느 날 다른 코드를 돌린다(`ci.yml` 상단 주석의 같은 판단).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      # `--fatal-infos`: 이 저장소는 경고를 쌓아 두지 않는다. info 하나가 남으면 다음
      # info 도 남고, 결국 아무도 그 목록을 안 읽는다.
      - run: flutter analyze --fatal-infos
        working-directory: mobile

      - run: flutter test
        working-directory: mobile

  # iOS 빌드는 macOS 러너여야 한다. **과금 배수가 붙으므로** paths 필터가 걸린 이 워크플로
  # 안에만 둔다.
  #
  # `--no-codesign`: 서명은 계획서 §9(TestFlight)의 일이고 그때 사람과 함께 연다. 지금
  # 확인할 것은 "이 코드가 iOS 로 빌드되는가" 하나다 — 서명 없이도 그 답은 나온다.
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      - run: flutter build ios --no-codesign
        working-directory: mobile
